; esp-now-router — headless ESP-NOW backbone router for the AMPWorks sensor-sync mesh.
; Non-WLED firmware: multi-hop relay of AMPS frames, leader election, and HTTP-OTA.
;
; Shared wire format (approach (a)): the SensorSync protocol + SPSC ring headers are included
; straight from the sibling WLED submodule via -I below — single source of truth, no copy. This
; resolves when built inside the WLED_dev super-repo (both are submodules there). A standalone
; clone of this repo alone would need WLED present; the alternative is hoisting the header into
; its own shared library that both repos depend on.

[platformio]
default_envs = wt32-eth01
test_dir = tests

[env]
platform = espressif32
framework = arduino
custom_serial_baud = 115200
monitor_speed = ${this.custom_serial_baud}
lib_deps =
  gmag11/QuickESPNow @ ^0.8.1
  ; leveled serial debug (shared with the WLED usermods); sibling ArduinoLibs submodule of WLED_dev
  ${PROJECT_DIR}/../ArduinoLibs/Debug
build_flags =
  ; approach (a): shared wire headers from the WLED submodule (sensor_sync_protocol.h + ring)
  -I ${PROJECT_DIR}/../WLED/usermods/ampworks
  ; fixed ESP-NOW channel — MUST match the edges' WiFi/ESP-NOW channel (override per install)
  -D ROUTER_ESPNOW_CHANNEL=1
  ; debug verbosity: 1 = errors + major only (default). Raise (2..5) for per-frame/trace logs.
  -D DEBUG_LEVEL=1
  ; console baud — shared with monitor_speed above so the two cannot drift
  -D ROUTER_SERIAL_BAUD=${this.custom_serial_baud}

[env:wt32-eth01]
board = wt32-eth01
; WT32-ETH01: LAN8720 ethernet (unused for relaying — ESP-NOW rides WiFi). The RMII pins limit
; free GPIO; the board has no USB, so the first flash is over a USB-TTL serial adapter.

; A generic devkit env for bench-testing the relay logic on any ESP32 (no ethernet PHY).
[env:esp32dev]
board = esp32dev

# Host-native unit tests: `pio test -e native` runs the pure router logic (relay + election)
# on your machine — no device needed. Run from inside WLED_dev so the sibling WLED wire header
# resolves. `test_framework = custom` = our tests own their main() (return non-zero on failure).
[env:native]
platform = native
framework =                 ; host compile — clear the inherited arduino framework
lib_deps =                  ; clear the inherited device libs (QuickEspNow/Debug); tests are pure
lib_ldf_mode = off
test_framework = custom
build_flags =               ; override the device flags; pure host + the shared/router headers
  -std=c++11 -Wall -Wextra
  -I ${PROJECT_DIR}/../WLED/usermods/ampworks
  -I ${PROJECT_DIR}/src

# The WLED-coordinator role: a third env, NOT a fork. Same sources, same board, one flag.
# It is a variant because it needs the ESP-NOW receive path this repo already has — see the plan.
# Nothing else in the tree changes shape: esp32dev and wt32-eth01 build byte-identically without it.
# NOTE: this env on its own will build but cannot do anything useful — it supplies neither the
# router's WiFi credentials (ROUTER_WIFI_SSID/PASS, which bring up HTTP and OTA) nor the
# coordinator's home network (COORD_HOME_SSID/PASS, which is what it pushes to targets). Both are
# deliberately not in git. Supply them in a gitignored platformio_override.ini, or on the command
# line for a one-off:
#
#   PLATFORMIO_BUILD_FLAGS='-DROUTER_WIFI_SSID=\"Net\" -DROUTER_WIFI_PASS=\"pw\"
#     -DCOORD_HOME_SSID=\"Net\" -DCOORD_HOME_PASS=\"pw\"' pio run -e coordinator
#
# With no COORD_HOME_SSID the coordinator will push an empty SSID, which wled_build_onboard_cfg
# refuses with WLED_CFG_BAD_SSID — a clean failure rather than a device joining nothing, but a
# failure all the same.
[env:coordinator]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D WLED_COORDINATOR_ROLE
