; Copy to platformio_override.ini (gitignored) and set your infra-WiFi creds so the router can
; associate and expose the HTTP OTA endpoint. Without creds the router falls back to its own
; SoftAP (see README) and still relays either way, since ESP-NOW is channel-based rather than
; AP-based. Keep the router on the SAME AP/channel as the edges.
;
; PlatformIO auto-loads platformio_override.ini; these build_flags append to the env's.
;
; The nested quoting on the cred flags is required, not decoration: the macro has to expand to a
; C string literal, so the value needs its own inner double quotes. Written as -D FOO='bar' the
; macro expands to the bare identifier bar and the build fails with "use of undeclared
; identifier". The outer single quotes keep the shell/ini parser from eating the inner ones, and
; they also let an SSID or passphrase contain spaces or a ';'.

[env:wt32-eth01]
build_flags =
  ${env.build_flags}
  -D ROUTER_WIFI_SSID='"your-ssid"'
  -D ROUTER_WIFI_PASS='"your-pass"'
  ; -D ROUTER_ESPNOW_CHANNEL=6   ; override to match your AP's channel if not 1
  ; -D ROUTER_SERIAL_BAUD=115200 ; console baud (monitor_speed follows it)

; Flashing over HTTP once the firmware is on the device (mirrors WLED's upload flow):
;   curl -F "file=@.pio/build/wt32-eth01/firmware.bin" http://<router-ip>/update
